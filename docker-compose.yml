version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: aisvoi_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Для систем без GPU уберите блок deploy выше

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aisvoi_backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DATABASE_URL=sqlite:///./data/aisvoi.db
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aisvoi_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
  backend_data:
